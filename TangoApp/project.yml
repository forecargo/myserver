name: TangoApp

options:
  bundleIdPrefix: com.hoshinoji
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug

# Xcode の「Update to recommended settings」警告を恒久的に抑止するため、
# プロジェクトの LastUpgradeCheck を現行 Xcode (26.x) に合わせる。
attributes:
  LastUpgradeCheck: "2660"
  LastSwiftUpdateCheck: "2660"

# 推奨ビルド設定: ビルドフェーズのスクリプトをサンドボックス化する。
# 本プロジェクトはカスタム Run Script を持たないため安全に有効化できる。
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: YES

configs:
  Debug: debug
  Release: release

targets:
  TangoApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: たんご
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      SWIFT_VERSION: "5.9"
      PRODUCT_BUNDLE_IDENTIFIER: com.hoshinoji.tango
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1"
      # iPhone 専用。Mac (Apple Silicon) / Apple Vision Pro での
      # 互換実行 ("Designed for iPhone") も対象外にする。
      SUPPORTS_MACCATALYST: NO
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  TangoAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: TangoApp
    settings:
      SWIFT_VERSION: "5.9"
      PRODUCT_BUNDLE_IDENTIFIER: com.hoshinoji.tango.tests
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      GENERATE_INFOPLIST_FILE: YES
